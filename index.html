<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>雲南旅費記帳</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--tx:#222;--sub:#7a766d;--ac:#c4552d;--ln:#e6e2d9;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#181715;--card:#242220;--tx:#f0ede6;--sub:#9d988d;--ac:#e8794f;--ln:#38352f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#181715;--card:#242220;--tx:#f0ede6;--sub:#9d988d;--ac:#e8794f;--ln:#38352f;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,"PingFang TC","Noto Sans TC",sans-serif;max-width:560px;margin:auto;padding:14px}
h1{font-size:20px;margin:4px 0 10px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.big{font-size:26px;font-weight:700}.tw{font-size:12px;color:var(--sub);font-weight:400;margin-left:6px}
.sub{font-size:12px;color:var(--sub)}
.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px}
.d{flex:0 0 auto;border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:12px;padding:6px 10px;text-align:center;font:inherit;font-size:13px;cursor:pointer}
.d b{display:block;font-size:14px}.d.on{background:var(--ac);border-color:var(--ac);color:#fff}
.row{display:flex;gap:8px;margin-top:8px}
input,select,button.go{font:inherit;border:1px solid var(--ln);background:var(--bg);color:var(--tx);border-radius:10px;padding:9px 10px;min-width:0}
input{flex:1}
#amt{font-size:20px;font-weight:600}
.cats{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.c{border:1px solid var(--ln);background:var(--bg);color:var(--tx);border-radius:99px;padding:5px 11px;font:inherit;font-size:14px;cursor:pointer}
.c.on{background:var(--ac);border-color:var(--ac);color:#fff}
button.go{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:600;cursor:pointer}
.it{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-top:1px solid var(--ln)}
.it:first-child{border-top:0}
.it .r{text-align:right}.x{background:none;border:0;color:var(--sub);font-size:18px;cursor:pointer;padding:4px 8px}
.rate{width:80px;flex:none;text-align:center}
</style>
</head>
<body>
<h1>🏔️ 雲南旅費記帳</h1>
<div class="card">
  <div class="sub">全程總花費</div>
  <div class="big"><span id="tot">¥0</span><span class="tw" id="totT"></span></div>
  <div class="sub" id="avg"></div>
  <div class="sub" id="who" style="margin-top:2px"></div>
  <div class="sub" id="who2" style="margin-top:2px"></div>
  <div class="row" style="align-items:center"><span class="sub">匯率 1 人民幣 =</span><input class="rate" id="rate" type="number" step="0.01" inputmode="decimal"><span class="sub">台幣（可自行調整）</span></div>
  <div class="row" style="align-items:center"><button class="go" id="exp">⬇ 匯出 CSV（Google 試算表可開）</button><span class="sub" id="msg"></span></div>
</div>
<div class="days" id="days"></div>
<div class="card">
  <div class="sub" id="dlabel"></div>
  <div class="big"><span id="dtot">¥0</span><span class="tw" id="dtotT"></span></div>
</div>
<div class="card">
  <input id="amt" type="number" inputmode="decimal" placeholder="金額（人民幣 ¥）" style="width:100%">
  <div class="cats" id="cats"></div>
  <div class="sub" style="margin-top:10px">誰付的</div><div class="cats" id="pays" style="margin-top:4px"></div>
  <div class="sub" style="margin-top:10px">支付方式</div><div class="cats" id="meths" style="margin-top:4px"></div>
  <div class="row"><input id="note" placeholder="備註（例：過橋米線）"><button class="go" id="add">新增</button></div>
</div>
<div class="card" id="list"></div>
<script>
const DAYS=[];const wk="日一二三四五六";
for(let i=0;i<8;i++){const dt=new Date(2026,10,17+i);DAYS.push({n:i+1,key:"2026-11-"+String(17+i).padStart(2,"0"),label:(dt.getMonth()+1)+"/"+dt.getDate(),w:wk[dt.getDay()]})}
const CATS=["🍜 餐飲","🚕 交通","🏨 住宿","🎫 門票","🛍️ 購物","📦 其他"];
let st={rate:4.4,items:[]};
try{const s=localStorage.getItem("yn-trip");if(s)st=Object.assign(st,JSON.parse(s))}catch(e){}
const save=()=>{try{localStorage.setItem("yn-trip",JSON.stringify(st))}catch(e){}};
const PAYERS=["我","先生","媽媽"];const METHODS=["現金","刷卡","電子支付"];let cur=0,cat=CATS[0],pay=PAYERS[0],meth=METHODS[0];
const $=id=>document.getElementById(id);
const cny=v=>"¥"+v.toLocaleString("zh-TW",{maximumFractionDigits:2});
const twd=v=>"≈ NT$"+Math.round(v*st.rate).toLocaleString("zh-TW");
const sum=a=>a.reduce((s,x)=>s+x.amt,0);
function render(){
  $("rate").value=st.rate;
  const t=sum(st.items);$("tot").textContent=cny(t);$("totT").textContent=twd(t);
  const used=DAYS.filter(d=>st.items.some(x=>x.day===d.key)).length;
  $("avg").textContent=used?("平均每天 "+cny(Math.round(t/used*100)/100)+"（"+twd(t/used)+"）"):"";
  $("who").textContent="已付："+PAYERS.map(p=>p+" "+cny(sum(st.items.filter(x=>x.pay===p)))).join("　");
  $("who2").textContent="方式："+METHODS.map(p=>p+" "+cny(sum(st.items.filter(x=>x.meth===p)))).join("　");
  $("days").innerHTML="";
  DAYS.forEach((d,i)=>{const b=document.createElement("button");b.className="d"+(i===cur?" on":"");b.innerHTML="<b>Day "+d.n+"</b>"+d.label+"（"+d.w+"）";b.onclick=()=>{cur=i;render()};$("days").appendChild(b)});
  const d=DAYS[cur],its=st.items.filter(x=>x.day===d.key),dt=sum(its);
  $("dlabel").textContent="Day "+d.n+"・"+d.label+"（週"+d.w+"）";
  $("dtot").textContent=cny(dt);$("dtotT").textContent=twd(dt);
  $("cats").innerHTML="";
  CATS.forEach(c=>{const b=document.createElement("button");b.className="c"+(c===cat?" on":"");b.textContent=c;b.onclick=()=>{cat=c;render()};$("cats").appendChild(b)});
  $("pays").innerHTML="";
  PAYERS.forEach(p=>{const b=document.createElement("button");b.className="c"+(p===pay?" on":"");b.textContent=p;b.onclick=()=>{pay=p;render()};$("pays").appendChild(b)});
  $("meths").innerHTML="";
  METHODS.forEach(p=>{const b=document.createElement("button");b.className="c"+(p===meth?" on":"");b.textContent=p;b.onclick=()=>{meth=p;render()};$("meths").appendChild(b)});
  const L=$("list");L.innerHTML="";
  if(!its.length){L.innerHTML='<div class="sub">這天還沒有記錄</div>';return}
  its.slice().reverse().forEach(x=>{
    const r=document.createElement("div");r.className="it";
    const l=document.createElement("div");l.textContent=x.cat+(x.note?"　"+x.note:"")+(x.pay?"・"+x.pay+"付":"")+(x.meth?"・"+x.meth:"");
    const rt=document.createElement("div");rt.className="r";
    rt.innerHTML="<div></div><div class='sub'></div>";rt.children[0].textContent=cny(x.amt);rt.children[1].textContent=twd(x.amt);
    const del=document.createElement("button");del.className="x";del.textContent="✕";del.onclick=()=>{st.items=st.items.filter(y=>y.id!==x.id);save();render()};
    const w=document.createElement("div");w.style.cssText="display:flex;align-items:center";w.append(rt,del);
    r.append(l,w);L.appendChild(r)});
}
$("add").onclick=()=>{const a=parseFloat($("amt").value);if(!(a>0)){$("amt").focus();return}
  st.items.push({id:Date.now(),day:DAYS[cur].key,amt:a,cat,pay,meth,note:$("note").value.trim()});
  $("amt").value="";$("note").value="";save();render();$("amt").focus()};
$("rate").onchange=()=>{const r=parseFloat($("rate").value);if(r>0){st.rate=r;save()}render()};
function makeCsv(){
  const q=v=>'"'+String(v).replace(/"/g,'""')+'"';
  const rows=[["Day","日期","分類","備註","誰付的","支付方式","人民幣(CNY)","台幣(TWD,匯率"+st.rate+")"]];
  DAYS.forEach(d=>st.items.filter(x=>x.day===d.key).forEach(x=>rows.push(["Day "+d.n,d.key,x.cat.replace(/^\S+\s/,""),x.note||"",x.pay||"",x.meth||"",x.amt,Math.round(x.amt*st.rate)])));
  const t=sum(st.items);rows.push(["合計","","","","","",Math.round(t*100)/100,Math.round(t*st.rate)]);
  return "\uFEFF"+rows.map(r=>r.map(q).join(",")).join("\r\n");
}
$("exp").onclick=async()=>{
  const m=$("msg");
  if(!st.items.length){m.textContent="還沒有記錄可匯出";return}
  const csv=makeCsv();
  let dl=null;try{dl=await claude.use("downloads")}catch(e){}
  if(dl){try{await dl.save({filename:"雲南旅費.csv",data:csv});m.textContent="已匯出";return}catch(e){if(e&&e.code==="declined"){m.textContent="已取消";return}}}
  try{await navigator.clipboard.writeText(csv);m.textContent="無法下載，已複製內容，可貼到試算表"}catch(e){m.textContent="此環境無法匯出"}
};
render();
</script>
</body>
</html>
